services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: personalized
      POSTGRES_PASSWORD: personalized
      POSTGRES_DB: personalized_recommendations_core
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personalized -d personalized_recommendations_core"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - personalized_postgres_data:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &app_environment
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://personalized:personalized@postgres:5432/personalized_recommendations_core
      MODEL_COST_UNIT: CNY
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    ports:
      - "8000:8000"
    environment: *app_environment
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  personalized_postgres_data:
